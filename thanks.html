<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Thank you for contacting Johnson Renovations.">
<title>Thank You | Johnson Renovations</title>
<style>
:root{--charcoal:#1d252b;--blue:#1387a8;--gold:#b99558;--paper:#f7f8f8;--muted:#6c777e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:#263038;line-height:1.6}
.wrap{min-height:100vh;display:grid;place-items:center;padding:2rem}
.card{width:min(720px,94%);background:#fff;border-radius:24px;padding:3rem;box-shadow:0 18px 45px rgba(26,34,39,.14);text-align:center;border-top:4px solid var(--gold)}
.logo{height:72px;max-width:330px;margin:0 auto 1.5rem}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.5rem,6vw,4.5rem);line-height:1;margin:.3rem 0 1rem}
p{color:var(--muted);font-size:1.08rem}
.btn{display:inline-flex;margin-top:1.2rem;padding:.95rem 1.3rem;border-radius:999px;background:var(--charcoal);color:#fff;text-decoration:none;font-weight:800}
.small{font-size:.9rem;margin-top:1.4rem}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <img class="logo" src="assets/johnson-renovations-logo.webp" alt="Johnson Renovations">
    <div style="color:var(--gold);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem">Consultation Request Received</div>
    <h1>Thank you for reaching out.</h1>
    <p>Your project details have been sent to the Johnson Renovations team. We’ll review your request and follow up with you directly.</p>
    <a class="btn" href="/">Return to the Website</a>
    <p class="small">Need to reach us sooner? Call <a href="tel:2145360093">214-536-0093</a>.</p>
  </main>
</div>
</body>
</html>
